name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Clé de signature stable depuis les secrets du repo (voir README)
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Pas de secret KEYSTORE_BASE64 : APK signé avec une clé debug temporaire (les mises à jour ne s'installeront pas par-dessus)."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk meowcha-cafe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: meowcha-cafe-${{ steps.version.outputs.version }}
          path: meowcha-cafe.apk

      # Release créée uniquement depuis la branche par défaut pour une NOUVELLE version
      # (fichier VERSION modifié), ou quand un tag v* est poussé.
      # Les autres branches (ex. 1.1.0) produisent seulement un APK de test en artefact.
      - name: Publish GitHub release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.ref_name == github.event.repository.default_branch && steps.version.outputs.exists == 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Meowcha Café v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          body: |
            🐱☕ Meowcha Café v${{ steps.version.outputs.version }}

            **Télécharger :** `meowcha-cafe.apk` ci-dessous et ouvre-le sur ton téléphone Android.
          files: meowcha-cafe.apk

      # Sur les autres branches (ex. 1.1.0) : bêta téléchargeable directement,
      # remplacée à chaque push, jamais marquée comme "latest".
      - name: Publish beta pre-release
        if: >-
          !startsWith(github.ref, 'refs/tags/') &&
          github.ref_name != github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-beta
          name: Meowcha Café v${{ steps.version.outputs.version }} (bêta)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            🧪 Version de test de la branche `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Télécharge `meowcha-cafe.apk` ci-dessous. Remplacée à chaque nouveau build.
          files: meowcha-cafe.apk
