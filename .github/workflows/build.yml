name: Build APK

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk meowcha-cafe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: meowcha-cafe-apk
          path: meowcha-cafe.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Meowcha Café v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            🐱☕ Nouvelle version de Meowcha Café !

            **Télécharger :** `meowcha-cafe.apk` ci-dessous, puis ouvre-le sur ton téléphone Android
            (autorise l'installation depuis des sources inconnues si demandé).
          files: meowcha-cafe.apk
